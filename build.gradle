plugins {
    id 'java'
}
def lwjglVersion = "3.3.4"

group = 'com.projektdeus.game'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()

    maven {
        url "https://docking-frames.org/releases"
    }
}


dependencies {
    implementation("com.google.code.gson:gson:2.10.1")
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"
    implementation "org.lwjgl:lwjgl-nanovg:3.3.3"
    implementation "org.lwjgl:lwjgl-nanovg:3.3.3:natives-windows"
    implementation "org.lwjgl:lwjgl-nanovg:3.3.3:natives-linux"
    implementation "org.lwjgl:lwjgl-nanovg:3.3.3:natives-macos"
    runtimeOnly "org.lwjgl:lwjgl::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-glfw::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-opengl::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-stb::natives-windows"
}


java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
