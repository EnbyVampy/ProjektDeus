plugins {
    id 'java'
    id 'application' // Added to allow you to run the app directly via Gradle
}

group = 'com.projektdeus.game'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

// 1. Centralized Version Management
project.ext.lwjglVersion = "3.3.3"
project.ext.imguiVersion = "1.86.11" // Stable version on io.github.spair

// 2. Detect Operating System for Natives
import org.gradle.internal.os.OperatingSystem
switch (OperatingSystem.current()) {
    case OperatingSystem.LINUX:
        project.ext.lwjglNatives = "natives-linux"
        break
    case OperatingSystem.MAC_OS:
        project.ext.lwjglNatives = "natives-macos"
        break
    case OperatingSystem.WINDOWS:
        project.ext.lwjglNatives = "natives-windows"
        break
}

dependencies {
    implementation "org.lwjgl:lwjgl-tinyfd"
    runtimeOnly "org.lwjgl:lwjgl-tinyfd::$lwjglNatives"
    // --- GSON for Presets ---
    implementation "com.google.code.gson:gson:2.10.1"

    // --- LWJGL Core (Using BOM to keep versions in sync) ---
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"
    implementation "org.lwjgl:lwjgl-nanovg"

    // --- LWJGL Natives (Automatically selects based on your OS) ---
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-nanovg::$lwjglNatives"

    // --- ImGui Java Bindings (FIXED COORDINATES) ---
    implementation "io.github.spair:imgui-java-binding:$imguiVersion"
    implementation "io.github.spair:imgui-java-lwjgl3:$imguiVersion"

    // --- ImGui Natives (Multi-platform support) ---
    runtimeOnly "io.github.spair:imgui-java-natives-windows:$imguiVersion"
    runtimeOnly "io.github.spair:imgui-java-natives-linux:$imguiVersion"
    runtimeOnly "io.github.spair:imgui-java-natives-macos:$imguiVersion"
}

application {
    // Ensure this matches your file structure exactly
    mainClass = 'com.projektdeus.game.Main'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}